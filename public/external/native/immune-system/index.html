<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<title>Hệ miễn dịch</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
    html, body {
        margin: 0; 
        padding: 0; 
        overflow: hidden; 
        background: #020617;
        width: 100%;
        height: 100%;
    }
    canvas {
        display: block; 
        margin: auto;
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
    }
</style>
<script>
    var canvas, stage, exportRoot, images, ss;

    function init() {
        canvas = document.getElementById("canvas");
        createjs.LoadItem.LOAD_TIMEOUT_DEFAULT = 120 * 1000;
        createjs.MotionGuidePlugin.install();

        if (lib.properties.manifest && lib.properties.manifest.length) {
            images = images || {};
            ss = ss || {};
            var loader = new createjs.LoadQueue(false);
            loader.addEventListener("fileload", handleFileLoad);
            loader.addEventListener("complete", handleComplete);
            loader.loadManifest(lib.properties.manifest);
        } else {
            handleComplete();
        }
    }

    function handleFileLoad(evt) {
        if (evt.item.type == "image") {
            images[evt.item.id] = evt.result;
        }
    }

    function handleComplete(evt) {
        if (evt) {
            var queue = evt.target;
            var ssMetadata = lib.ssMetadata;
            for (var i = 0; i < ssMetadata.length; i++) {
                ss[ssMetadata[i].name] = new createjs.SpriteSheet({
                    "images": [queue.getResult(ssMetadata[i].name)],
                    "frames": ssMetadata[i].frames
                })
            }
        }

        exportRoot = new lib._40();
        stage = new createjs.Stage(canvas);
        
        // Background - Chuyển sang nền tối đồng bộ hệ thống
        var bg = new createjs.Shape();
        bg.graphics.beginFill('#020617').drawRect(-500, -500, lib.properties.width + 1000, lib.properties.height + 1000);
        bg.mouseEnabled = false; // QUAN TRỌNG: Không chặn sự kiện chuột tới các nút bên dưới
        exportRoot.addChildAt(bg, 0);
        bg.on('tick', function() {
            if (exportRoot.getChildIndex(bg) != 0) exportRoot.setChildIndex(bg, 0);
            bg.mouseEnabled = false; // Đảm bảo luôn tắt tương tác cho nền
        });

        // DEEP PATCH: HIDE COPYRIGHT & RESTORE INTERACTION
        var patchAttempts = 0;
        var patchInterval = setInterval(function() {
            if (exportRoot) {
                // Đảm bảo container chính luôn nhận chuột
                exportRoot.mouseEnabled = true;
                exportRoot.mouseChildren = true;

                // Force initial resize and cleanup
                resize();

                // Override nav behavior
                if (exportRoot.nav) {
                    exportRoot.nav.visible = false;
                    exportRoot.nav.alpha = 0;
                }

                // Hide copyright but PROTECT interactive buttons
                const cleanup = (obj) => {
                    if (!obj || !obj.children) return;
                    obj.children.forEach(child => {
                        const name = (child.name || "").toLowerCase();
                        const isOriginalNav = name.includes('nav') || name.includes('controller') || name.includes('logo') || name.includes('title');
                        
                        // Chỉ ẩn nếu là thành phần điều hướng gốc, KHÔNG ẩn các nút chọn cơ quan
                        if (isOriginalNav) {
                            child.visible = false;
                            child.alpha = 0;
                            child.mouseEnabled = false;
                        }

                        // Hide anything that looks like a copyright text
                        if (child.text && (child.text.includes('Copyright') || child.text.includes('National Taiwan') || child.text.includes('eduMedia'))) {
                            child.visible = false;
                        }
                        cleanup(child);
                    });
                };
                cleanup(exportRoot);

                patchAttempts++;
                if (patchAttempts > 20) clearInterval(patchInterval); 
            }
        }, 200);

        stage.addChild(exportRoot);
        canvas.style.display = '';
        stage.update();
        stage.enableMouseOver();

        createjs.Ticker.setFPS(lib.properties.fps);
        createjs.Ticker.addEventListener("tick", stage);
        createjs.Touch.enable(stage);

        resize();
        window.addEventListener('resize', resize);
    }

    function resize() {
        var w = window.innerWidth;
        var h = window.innerHeight;
        var hRatio = w / lib.properties.width;
        var vRatio = h / lib.properties.height;
        
        // Căn lề và phóng lớn cưỡng bức (Perfect Fit)
        var minRatio = Math.min(hRatio, vRatio);
        var theaterRatio = minRatio * 1.0; // Hệ số 1.0 theo yêu cầu riêng cho bài Hệ miễn dịch

        canvas.width = w;
        canvas.height = h;
        
        if (exportRoot) {
            // 1. Ẩn thanh công cụ và bản quyền một cách triệt để
            if (exportRoot.nav) {
                exportRoot.nav.visible = false;
                exportRoot.nav.alpha = 0;
            }

            // 2. Gỡ bỏ mặt nạ cắt (Mask) của nội dung chính
            if (exportRoot.instance) {
                exportRoot.instance.mask = null;
            }

            // 3. Áp dụng tỷ lệ phóng lớn và căn giữa
            exportRoot.scaleX = exportRoot.scaleY = theaterRatio;
            
            // Căn giữa nội dung
            exportRoot.x = (w - (lib.properties.width * theaterRatio)) / 2; 
            exportRoot.y = (h - (lib.properties.height * theaterRatio)) / 2;
        }
        
        stage.update();
    }
</script>
</head>
<body onload="init();">
<canvas id="canvas" width="550" height="390" style="background-color:#020617; display: none"></canvas>
<script src="vendor/gettext.min.js"></script>
<script src="immune-system/gettext-vi.js"></script>
<script src="vendor/three.min.js"></script>
<script src="vendor/createjs-2015.11.26.min.js"></script>
<script src="compo.min.js"></script>
<script src="immune-system/immune-system-1.js"></script>
</body>
</html>
